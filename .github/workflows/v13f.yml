name: v13f-offline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  remediation:
    name: remediation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ github.workspace }}/.git/dt-v013f/go-tmp
      GOTMPDIR: ${{ github.workspace }}/.git/dt-v013f/go-tmp
      GOCACHE: ${{ github.workspace }}/.git/dt-v013f/go-cache
      GOMODCACHE: ${{ github.workspace }}/.git/dt-v013f/go-mod
      GOPATH: ${{ github.workspace }}/.git/dt-v013f/go-path
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dedicated scratch
        run: mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH" out
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Historical candidate in its original checkout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .git/dt-v013f/v13e-candidate e584107c1eacbcca10163aafbf8372f22745e0d8
          python3 -I -B .git/dt-v013f/v13e-candidate/analysis/alternatives/lock_check.py
          git worktree remove .git/dt-v013f/v13e-candidate
          git worktree add --detach .git/dt-v013f/v13f-baseline cf9a12bf12fc94089e8a99f73dea12edd0cfd019
      - name: Go regressions, format and unchanged evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          go test ./internal/alternatives ./internal/agent ./cmd/dreamteam -count=1 -timeout 30m
          go build -o .git/dt-v013f/dreamteam ./cmd/dreamteam
      - name: Historical replay prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for v in v08c v09c; do
            for f in docs/benchmark/$v-dev/eval-replay-*.json; do
              name=$(basename "$f" .json)
              .git/dt-v013f/dreamteam benchmark suite run "$f" -out "$v-$name" > /dev/null
              .git/dt-v013f/dreamteam benchmark verify "$v-$name" | tail -1
            done
          done
      - name: Workflow and driver tests
        shell: bash
        run: |
          set -euo pipefail
          DREAMTEAM_BINARY="$PWD/.git/dt-v013f/dreamteam" python3 -B -m unittest discover -s .git/dt-v013f/v13f-baseline/analysis/alternatives
          DREAMTEAM_BINARY="$PWD/.git/dt-v013f/dreamteam" python3 -B -m unittest discover -s analysis/alternatives -p test_v13g.py
          python3 -B -m unittest discover -s agents/llm
      - name: Frozen V0.13d evidence regeneration
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          V=docs/benchmark/v13d-dev
          python3 -I -B analysis/alternatives/v13d.py contexts --binary "$B" --check "$V/contexts"
          python3 -I -B analysis/alternatives/v13d.py protocol --contexts "$V/contexts" --out .git/dt-v013f/legacy-protocol.json
          cmp .git/dt-v013f/legacy-protocol.json "$V/protocol-draft.json"
          python3 -I -B analysis/alternatives/v13d.py schedule --contexts "$V/contexts" --protocol "$V/protocol-draft.json" --out .git/dt-v013f/legacy-schedule.json
          cmp .git/dt-v013f/legacy-schedule.json "$V/schedule-draft.json"
          python3 -I -B analysis/alternatives/v13d_fidelity.py fidelity --binary "$B" --contexts "$V/contexts" --replays . --out .git/dt-v013f/legacy-fidelity
          cmp .git/dt-v013f/legacy-fidelity/fidelity.json "$V/fidelity/fidelity.json"
          cmp .git/dt-v013f/legacy-fidelity/fidelity.md "$V/fidelity/fidelity.md"
      - name: Successor protocol, fidelity and complete review package
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          V=docs/benchmark/v13f-dev
          D=analysis/alternatives/v13f.py
          python3 -I -B "$D" contexts --binary "$B" --check "$V/contexts"
          python3 -I -B "$D" protocol --contexts "$V/contexts" --out .git/dt-v013f/protocol.json
          cmp .git/dt-v013f/protocol.json "$V/protocol-draft.json"
          python3 -I -B "$D" schedule --contexts "$V/contexts" --protocol "$V/protocol-draft.json" --out .git/dt-v013f/schedule.json
          cmp .git/dt-v013f/schedule.json "$V/schedule-draft.json"
          python3 -I -B "$D" check --binary "$B" --contexts "$V/contexts" --protocol "$V/protocol-draft.json" --replays .
          python3 -I -B analysis/alternatives/v13f_fidelity.py fidelity --binary "$B" --contexts "$V/contexts" --replays . --out .git/dt-v013f/fidelity
          cmp .git/dt-v013f/fidelity/fidelity.json "$V/fidelity/fidelity.json"
          cmp .git/dt-v013f/fidelity/fidelity.md "$V/fidelity/fidelity.md"
          diff -r .git/dt-v013f/fidelity/interactions "$V/fidelity/interactions"
          python3 -I -B analysis/alternatives/v13f_package.py --source .git/dt-v013f/fidelity --check
          python3 -I -B analysis/alternatives/v13f_identities.py --check
          python3 -I -B .git/dt-v013f/v13f-baseline/analysis/alternatives/v13f_manifest.py
          cp "$V/fidelity/fidelity.json" out/v13f-fidelity.json
          cp "$V/protocol-draft.json" out/v13f-protocol.json
          cp "$V/schedule-draft.json" out/v13f-schedule.json
          cp docs/v13f/review-package/SHA256SUMS out/v13f-review-package-SHA256SUMS
      - name: Final technical remediation contracts and evidence
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          V=docs/benchmark/v13g-dev
          D=analysis/alternatives/v13g.py
          python3 -I -B "$D" contexts --binary "$B" --check "$V/contexts"
          python3 -I -B "$D" protocol --contexts "$V/contexts" --out .git/dt-v013f/v13g-protocol.json
          cmp .git/dt-v013f/v13g-protocol.json "$V/protocol-draft.json"
          python3 -I -B "$D" schedule --contexts "$V/contexts" --protocol "$V/protocol-draft.json" --out .git/dt-v013f/v13g-schedule.json
          cmp .git/dt-v013f/v13g-schedule.json "$V/schedule-draft.json"
          python3 -I -B "$D" check --binary "$B" --contexts "$V/contexts" --protocol "$V/protocol-draft.json" --replays .
          python3 -I -B analysis/alternatives/v13g_fidelity.py fidelity --binary "$B" --contexts "$V/contexts" --replays . --out .git/dt-v013f/v13g-fidelity
          diff -r .git/dt-v013f/v13g-fidelity/interactions "$V/fidelity/interactions"
          cmp .git/dt-v013f/v13g-fidelity/fidelity.json "$V/fidelity/fidelity.json"
          cmp .git/dt-v013f/v13g-fidelity/fidelity.md "$V/fidelity/fidelity.md"
          python3 -I -B analysis/alternatives/v13g_package.py --source .git/dt-v013f/v13g-fidelity --check
          python3 -I -B analysis/alternatives/v13g_identities.py --check
          cp "$V/fidelity/fidelity.json" out/v13g-fidelity.json
          cp "$V/protocol-draft.json" out/v13g-protocol.json
          cp "$V/schedule-draft.json" out/v13g-schedule.json
          cp docs/v13g/review-package/SHA256SUMS out/v13g-review-package-SHA256SUMS
      - name: Run-level failure recording and verification (V0.13h)
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          S=.git/dt-v013f/v13h
          V=docs/benchmark/v13h-dev
          C=docs/benchmark/v13g-dev/contexts
          mkdir -p "$S"
          DREAMTEAM_BINARY="$PWD/$B" python3 -B -m unittest discover -s analysis/alternatives -p test_v13h.py
          python3 -I -B analysis/alternatives/v13h.py protocol --contexts "$C" --out "$S/protocol.json"
          cmp "$S/protocol.json" "$V/protocol-draft.json"
          python3 -I -B analysis/alternatives/v13h.py schedule --contexts "$C" --protocol "$V/protocol-draft.json" --out "$S/schedule.json"
          cmp "$S/schedule.json" "$V/schedule-draft.json"
          python3 -I -B analysis/alternatives/v13h.py check --binary "$B" --contexts "$C" --protocol "$V/protocol-draft.json" --replays .
          python3 -I -B analysis/alternatives/v13h_fidelity.py fidelity --binary "$B" --contexts "$C" --replays . --out "$S/fidelity"
          for f in fidelity.json fidelity.md; do cmp "$S/fidelity/$f" "$V/fidelity/$f"; cp "$S/fidelity/$f" "out/v13h-$f"; done
          diff -r "$S/fidelity/interactions" "$V/fidelity/interactions"
          diff -r "$S/fidelity/lifecycle-examples" "$V/fidelity/lifecycle-examples"
          python3 -I -B analysis/alternatives/v13h_package.py --source "$S/fidelity" --check
          python3 -I -B analysis/alternatives/v13h_identities.py --check
          cp "$V/protocol-draft.json" out/v13h-protocol.json
          cp "$V/schedule-draft.json" out/v13h-schedule.json
          cp docs/v13h/review-package/SHA256SUMS out/v13h-review-package-SHA256SUMS
      - name: Run lifecycle state machine and systematic fault verification (V0.13i)
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          S=.git/dt-v013f/v13i
          V=docs/benchmark/v13i-dev
          C=docs/benchmark/v13g-dev/contexts
          mkdir -p "$S"
          python3 -B -m unittest discover -s analysis/alternatives -p test_lifecycle_spec.py
          DREAMTEAM_BINARY="$PWD/$B" python3 -B -m unittest discover -s analysis/alternatives -p test_v13i.py
          python3 -I -B analysis/alternatives/v13i.py protocol --contexts "$C" --out "$S/protocol.json"
          cmp "$S/protocol.json" "$V/protocol-draft.json"
          python3 -I -B analysis/alternatives/v13i.py schedule --contexts "$C" --protocol "$V/protocol-draft.json" --out "$S/schedule.json"
          cmp "$S/schedule.json" "$V/schedule-draft.json"
          python3 -I -B analysis/alternatives/v13i.py check --binary "$B" --contexts "$C" --protocol "$V/protocol-draft.json" --replays .
          python3 -I -B analysis/alternatives/v13i_examples.py --binary "$B" --out "$S/examples" --check "$V/lifecycle-examples"
          python3 -I -B analysis/alternatives/v13i_identities.py --check
          cp "$V/protocol-draft.json" out/v13i-protocol.json
          cp "$V/schedule-draft.json" out/v13i-schedule.json
          (cd "$S/examples" && find . -type f | LC_ALL=C sort | xargs shasum -a 256) > out/v13i-lifecycle-examples.sha256
      - name: Safe-point interrupts and sealed run completion (V0.13j)
        shell: bash
        run: |
          set -euo pipefail
          B=.git/dt-v013f/dreamteam
          S=.git/dt-v013f/v13j
          V=docs/benchmark/v13j-dev
          C=docs/benchmark/v13g-dev/contexts
          mkdir -p "$S"
          python3 -B -m unittest discover -s analysis/alternatives -p test_lifecycle_v2_spec.py
          DREAMTEAM_BINARY="$PWD/$B" python3 -B -m unittest discover -s analysis/alternatives -p test_v13j.py
          python3 -I -B analysis/alternatives/v13j.py protocol --contexts "$C" --out "$S/protocol.json"
          cmp "$S/protocol.json" "$V/protocol-draft.json"
          python3 -I -B analysis/alternatives/v13j.py schedule --contexts "$C" --protocol "$V/protocol-draft.json" --out "$S/schedule.json"
          cmp "$S/schedule.json" "$V/schedule-draft.json"
          python3 -I -B analysis/alternatives/v13j.py check --binary "$B" --contexts "$C" --protocol "$V/protocol-draft.json" --replays .
          python3 -I -B analysis/alternatives/v13j_examples.py --binary "$B" --out "$S/examples" --check "$V/lifecycle-examples"
          python3 -I -B analysis/alternatives/v13j_identities.py --check
          cp "$V/protocol-draft.json" out/v13j-protocol.json
          cp "$V/schedule-draft.json" out/v13j-schedule.json
          (cd "$S/examples" && find . -type f | LC_ALL=C sort | xargs shasum -a 256) > out/v13j-lifecycle-examples.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: v13f-results-${{ matrix.os }}
          path: out/
  compare:
    needs: remediation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: results
          pattern: v13f-results-*
      - name: Compare final artifacts across platforms
        shell: bash
        run: |
          set -euo pipefail
          for file in results/v13f-results-ubuntu-latest/*; do
            name=$(basename "$file")
            for platform in ubuntu-24.04-arm macos-latest; do
              cmp "$file" "results/v13f-results-$platform/$name"
            done
          done

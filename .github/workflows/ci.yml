name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux amd64, Linux arm64 and macOS arm64: the golden references
        # pin every digest, so passing them on each platform means the same
        # outcomes everywhere (acceptance criterion 8).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Platform
        run: go version && go env GOOS GOARCH
      - name: Vet
        run: |
          go vet ./...
          go vet -tags calibration ./...
          go vet -tags acceptance ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1 -timeout 30m
      - name: Golden references
        # Outcomes and digests against the pinned references, through the
        # documented migration manifest (testdata/golden/README.md): the
        # state digest's schema changed in V0.2 Slice 1, and the manifest
        # records it. The engine name may lag a version bump.
        shell: bash
        run: |
          set -euo pipefail
          go build -o dt ./cmd/dreamteam
          mkdir -p out
          cd testdata/golden
          check() {
            f=$1; shift
            ../../dt run "$@" -verify-replay -format json -allow-engine-mismatch -golden-migrations MIGRATIONS.json -golden "$f" > "../../out/$f"
            echo "$f: outcomes identical"
          }
          check established-seed1-7d.json -scenario established -seed 1 -days 7
          check established-seed1-90d.json -scenario established -seed 1 -days 90
          check mini-seed1-7d.json -scenario mini -seed 1 -days 7
          check established-seed1-7d-actions.json -scenario established -seed 1 -days 7 -actions established-7d.actions.json
      - name: Python agent client
        # The reference client runs a session through dreamteam agent
        # --stdio as a subprocess (protocol, apply, advance, save, t90),
        # then checks the save with dreamteam verify and dreamteam t90.
        # Its transcript is compared across platforms below.
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cd out
          python3 -I ../clients/python/example_session.py --binary ../dt --days 5 --t90 --transcript agent-python.jsonl
          rm -f python-client.session.json
      - name: Benchmark harness
        # A small benchmark (testdata/benchmark/ci.json): every run through
        # the agent protocol, the reference Python policy as an external
        # process, verified with T90 recomputed, then rerun and compared
        # with its manifest. The manifest (every deterministic file's
        # SHA-256) is compared across platforms below.
        shell: bash
        run: |
          set -euo pipefail
          ./dt benchmark run testdata/benchmark/ci.json -out bench > /dev/null
          ./dt benchmark verify bench -t90 | tail -1
          ./dt benchmark reproduce bench -out bench-again 2> /dev/null | tail -1
          cp bench/manifest.json out/benchmark-manifest.json
      - name: Benchmark scenario suite
        # The V0.6a development suite's five scenarios with the built-in
        # policies (docs/benchmark/v06a-dev/ci.json), verified and rerun.
        # The manifest is compared across platforms below.
        shell: bash
        run: |
          set -euo pipefail
          ./dt benchmark run docs/benchmark/v06a-dev/ci.json -out suite > /dev/null
          ./dt benchmark verify suite | tail -1
          ./dt benchmark reproduce suite -out suite-again 2> /dev/null | tail -1
          cp suite/manifest.json out/suite-manifest.json
          # V0.6b: the suite runner, its contract report, and the four
          # built-in policies (docs/benchmark/v06b-dev/ci-suite-run.json).
          ./dt benchmark suite run docs/benchmark/v06b-dev/ci-suite-run.json -out suite-run > /dev/null
          ./dt benchmark verify suite-run | tail -1
          ./dt benchmark reproduce suite-run -out suite-run-again 2> /dev/null | tail -1
          cp suite-run/manifest.json out/suite-run-manifest.json
          cp suite-run/contract.txt out/suite-run-contract.txt
          # V0.7a: suite version 2, radiologist overtime paid
          # (docs/benchmark/v07a-dev/ci-suite-run.json).
          ./dt benchmark suite run docs/benchmark/v07a-dev/ci-suite-run.json -out suite-v2 > /dev/null
          ./dt benchmark verify suite-v2 | tail -1
          ./dt benchmark reproduce suite-v2 -out suite-v2-again 2> /dev/null | tail -1
          cp suite-v2/manifest.json out/suite-v2-manifest.json
          cp suite-v2/contract.txt out/suite-v2-contract.txt
          # V0.7b: suite version 3, financial solvency
          # (docs/benchmark/v07b-dev/ci-suite-run.json).
          ./dt benchmark suite run docs/benchmark/v07b-dev/ci-suite-run.json -out suite-v3 > /dev/null
          ./dt benchmark verify suite-v3 | tail -1
          ./dt benchmark reproduce suite-v3 -out suite-v3-again 2> /dev/null | tail -1
          cp suite-v3/manifest.json out/suite-v3-manifest.json
          cp suite-v3/contract.txt out/suite-v3-contract.txt
      - name: LLM agent
        # The agent's unit tests, then the smoke tests' recorded model
        # decisions replayed through the protocol without any model:
        # V0.5a's (a version 1 recording, docs/benchmark/v05a-dev) and
        # V0.5b's (version 2: the memory and prompt are rebuilt and checked
        # at every decision point, docs/benchmark/v05b-dev), and V0.5c's
        # multi-model evaluation, stage by stage (docs/benchmark/v05c-dev),
        # each verified and rerun, and V0.6c's frozen-agent comparison. The
        # replays' manifests are compared across platforms below.
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s agents/llm 2>&1 | tail -1
          for v in v05a v05b; do
            ./dt benchmark run docs/benchmark/$v-dev/replay.json -out llm-replay-$v > /dev/null
            ./dt benchmark verify llm-replay-$v | tail -1
            ./dt benchmark reproduce llm-replay-$v -out llm-replay-$v-again 2> /dev/null | tail -1
          done
          cp llm-replay-v05a/manifest.json out/llm-replay-manifest.json
          cp llm-replay-v05b/manifest.json out/llm-replay-v05b-manifest.json
          for s in a b c d; do
            ./dt benchmark run docs/benchmark/v05c-dev/stage-$s-replay.json -out llm-replay-v05c-$s > /dev/null
            ./dt benchmark verify llm-replay-v05c-$s | tail -1
            ./dt benchmark reproduce llm-replay-v05c-$s -out llm-replay-v05c-$s-again 2> /dev/null | tail -1
            cp llm-replay-v05c-$s/manifest.json out/llm-replay-v05c-$s-manifest.json
          done
          # V0.6c: the frozen-agent comparison's recorded decisions, one
          # suite run per stage and entry (docs/benchmark/v06c-dev), each
          # verified; the manifests are compared across platforms below.
          for f in docs/benchmark/v06c-dev/compare-*-replay-*.json; do
            n=$(basename "$f" .json)
            ./dt benchmark suite run "$f" -out "llm-$n" > /dev/null
            ./dt benchmark verify "llm-$n" | tail -1
            cp "llm-$n/manifest.json" "out/llm-$n-manifest.json"
          done
          # V0.7c: the frozen-agent evaluation under overtime and solvency
          # economics, one suite run per stage and entry
          # (docs/benchmark/v07c-dev), each verified and compared below.
          for f in docs/benchmark/v07c-dev/stage-*-replay-*.json; do
            n=$(basename "$f" .json)
            ./dt benchmark suite run "$f" -out "llm-v07c-$n" > /dev/null
            ./dt benchmark verify "llm-v07c-$n" | tail -1
            cp "llm-v07c-$n/manifest.json" "out/llm-v07c-$n-manifest.json"
          done
      - name: Decision evidence
        # V0.8a: the read-only analysis of every recorded LLM decision
        # replayed above (docs/benchmark/v08a-dev/corpus.json), without any
        # model: its unit tests, then the analysis twice, compared with
        # itself and with the committed evidence. The evidence and the
        # decision traces are compared across platforms below.
        # V0.8b: the v1 rules are frozen (analysis/evidence/frozen-v1.json):
        # check_frozen requires the frozen analyzer, tables and traces
        # byte for byte, and the frozen evidence in every field but the
        # engine build the replays were made with.
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s analysis/evidence 2>&1 | tail -1
          P="python3 -I -B"; C=docs/benchmark/v08a-dev/corpus.json
          $P analysis/evidence/decision_evidence.py --corpus $C --replays . --out evidence
          $P analysis/evidence/decision_evidence.py --corpus $C --replays . --out evidence-again > /dev/null
          cmp evidence/evidence.json evidence-again/evidence.json
          cmp evidence/traces.jsonl evidence-again/traces.jsonl
          $P analysis/evidence/check_frozen.py --out evidence
          cp evidence/evidence.json out/decision-evidence.json
          cp evidence/traces.jsonl out/decision-traces.jsonl
      - name: Evidence validation and outcomes
        # V0.8b, without any model: the seeded review package, the paired
        # financial and operational outcomes, the scripted funding-refusal
        # probes through the agent protocol, the frozen rules on the
        # probes, and the refusal-response evidence; each equal to the
        # committed one (docs/benchmark/v08b-dev) and compared across
        # platforms below.
        shell: bash
        run: |
          set -euo pipefail
          DREAMTEAM_BINARY=./dt python3 -B -m unittest discover -s analysis/probes 2>&1 | tail -1
          P="python3 -I -B"; C=docs/benchmark/v08a-dev/corpus.json; V=docs/benchmark/v08b-dev
          $P analysis/evidence/review_package.py --corpus $C --replays . --out review
          $P analysis/evidence/financial_outcomes.py --corpus $C --replays . --out fin
          $P analysis/probes/funding_probes.py --binary ./dt --probes $V/probes.json --out probes
          $P analysis/probes/probe_evidence.py --probes-out probes --out probe-evidence.json
          $P analysis/evidence/refusal_response.py --corpus $C --probes probes --out rr
          for f in manifest.json items.json items.md form.csv; do cmp review/$f $V/review/$f; cp review/$f out/review-$f; done
          for f in probe-log.json sequence-nocredit.decisions.jsonl sequence-nocredit.attempts.jsonl; do cmp probes/$f $V/probes-out/$f; cp probes/$f out/probes-$f; done
          for f in fin/financial-outcomes.json fin/financial-outcomes.md probe-evidence.json rr/refusal-response.json rr/refusal-response-tables.md; do
            cmp $f $V/$(basename $f); cp $f out/$(basename $f)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.os }}
          path: out/

  cross-platform:
    # The same commit's results, byte for byte, on every platform.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: Compare
        run: |
          set -eu
          ls results
          for f in results/results-ubuntu-latest/*; do
            n=$(basename "$f")
            for os in ubuntu-24.04-arm macos-latest; do
              cmp "$f" "results/results-$os/$n"
            done
            echo "$n: byte-identical on linux/amd64, linux/arm64, darwin/arm64"
          done
